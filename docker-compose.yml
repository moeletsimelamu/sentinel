name: sentinel

# Development stack. Ports are bound to 127.0.0.1 only.
# Optional overrides go in ./.env (copy from .env.example); defaults work without it.

x-backend: &backend
  build:
    context: ./backend
  image: sentinel-backend:dev
  env_file:
    - path: .env
      required: false
  environment:
    SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD:-sentinel}@db:5432/sentinel
    SENTINEL_MODELS_DIR: /app/models
  volumes:
    - ./models:/app/models:ro   # trained artefacts (git-ignored); read-only in containers
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: sentinel
    ports:
      - "127.0.0.1:${SENTINEL_DB_PORT:-5438}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${SENTINEL_API_PORT:-8088}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: ["python", "-m", "sentinel.worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
